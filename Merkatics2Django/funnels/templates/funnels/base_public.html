{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Clear-IA{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'funnels/index.css' %}">
    <link rel="stylesheet" href="{% static 'funnels/site.css' %}">
    <link rel="stylesheet" href="{% static 'funnels/footer.css' %}">
    {% block extra_head %}{% endblock %}
  </head>
  <body id="top">
    {% include "funnels/_public_header.html" %}
    {% block page_content %}{% endblock %}
    {% include "funnels/_footer.html" %}
    <script src="{% static 'funnels/event_popup_carousel.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
