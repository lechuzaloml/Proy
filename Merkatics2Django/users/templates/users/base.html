{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}merkatics-ClearIa{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'funnels/footer.css' %}">
</head>
<body id="top">
  <header class="site-header">
    <a class="brand" href="{% url 'selector_workspace' %}">merkatics-ClearIa</a>
    {% if request.usuario %}
      <nav aria-label="Navegación principal">
        <a href="{% url 'selector_workspace' %}">Empresas</a>
        <form method="post" action="{% url 'cerrar_sesion' %}">
          {% csrf_token %}
          <button class="link-button" type="submit">Cerrar sesión</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% include "funnels/_footer.html" %}
</body>
</html>
